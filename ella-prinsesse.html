<!-- ── ELLAS TEMA: farverne. app.css kender kun disse navne ────────────── -->
<style>
:root{
  --c2:#c0186e;            /* primær — knapper, aktiv fane */
  --c3:#f472b6;            /* lys — overskrift, fokus */
  --c4:#fda8d4;            /* tekst på mørk bund */
  --kant:#e0318a;          /* kantfarve på kort og felter */
  --accent:#f0c040;        /* guld — badge, log ind, resultatboks */
  --accent-shadow:#a07800;
  --dark:#2a0a1a;
  --shadow:#7a0a42;        /* 3D-skyggen under klodserne */
  --panel:rgba(55,5,32,.95);
  --welcome-bg:rgba(255,255,255,.05);
  --card-bg:rgba(55,5,32,.88);
  --card-solid:#3a0620;
  --input-bg:rgba(0,0,0,.42);
  --bg-gradient:linear-gradient(135deg,#1a0510 0%,#2d0a22 50%,#180818 100%);
  --tast-bg:#fbe9f4;       /* taltasterne: lys, næsten hvid klods */
  --tast-tekst:#2a0a1a;
  --tast-skygge:#c79ab2;
  --scan-bg:#8b3fa8;       /* lilla scan-knap */
  --scan-shadow:#4a1a6a;
  /* de seks klodsfarver, valgt med nummer 1-6 i dataene nedenfor */
  --brik-1:#c0186e;  --brik-2:#8f0d4e;  --brik-3:#8b3fa8;
  --brik-4:#7c3aed;  --brik-5:#b08000;  --brik-6:#be185d;
}
</style>
</head>
