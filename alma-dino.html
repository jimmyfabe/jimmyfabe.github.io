<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🦕 Almas LEGO Verden</title>

<!-- ── PWA / hjemskærm ─────────────────────────────────────────────────── -->
<link rel="manifest" href="manifest-alma.json">
<meta name="theme-color" content="#2d6a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- ── Delt stil (skriften ligger i fonts/ og hentes af app.css) ──────── -->
<link rel="stylesheet" href="app.css">

<!-- ── ALMAS TEMA: farverne. app.css kender kun disse navne ────────────── -->
<style>
:root{
  --c2:#4a9e30;            /* primær — knapper, aktiv fane */
  --c3:#7bc950;            /* lys — overskrift, fokus */
  --c4:#b5e87a;            /* tekst på mørk bund */
  --kant:#4a9e30;          /* kantfarve på kort og felter */
  --accent:#f5d000;        /* gul — badge, log ind, resultatboks */
  --accent-shadow:#a08900;
  --dark:#1a2e0a;
  --shadow:#1a3d0a;        /* 3D-skyggen under klodserne */
  --panel:rgba(25,52,8,.97);
  --welcome-bg:#1a2e0a;
  --card-bg:rgba(25,52,8,.9);
  --card-solid:#16290a;
  --input-bg:#0d1f05;
  --bg-gradient:linear-gradient(160deg,#0d1f05 0%,#1a3a08 40%,#0f2604 100%);
  --tast-bg:#e9f3e0;       /* taltasterne: lys, næsten hvid klods */
  --tast-tekst:#1a2e0a;
  --tast-skygge:#a9bd99;
  --scan-bg:#5a3e1b;       /* brun scan-knap */
  --scan-shadow:#2e1a06;
  /* de seks klodsfarver, valgt med nummer 1-6 i dataene nedenfor */
  --brik-1:#4a9e30;  --brik-2:#1f4f10;  --brik-3:#5a3e1b;
  --brik-4:#5aaa20;  --brik-5:#b09000;  --brik-6:#1a7a5a;
}
</style>
</head>
<body>
